<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fase 2 — Questão — Frações — Orbie IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #0d1a32;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── PHASE HEADER ── */
    .phase-header {
      width: 100%;
      background: #0d1a32;
      border-bottom: 1px solid #142a51;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 4px 24px;
      flex-shrink: 0;
    }

    .btn-close {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: none; background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      color: #fff;
    }
    .btn-close:hover { background: rgba(255,255,255,0.08); }

    /* Progress bar */
    .progress-wrap {
      flex: 1;
      height: 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 1000px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #37ec65;
      border-radius: 1000px;
      transition: width 0.4s ease;
    }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow-y: auto;
      padding: 24px 24px 120px;
    }

    .phase-template {
      width: 100%;
      max-width: 676px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px 0;
    }

    /* ── QUESTION STATEMENT ── */
    .question-statement {
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: #fff;
      white-space: pre-wrap;
    }

    /* ── OPTIONS ── */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 24px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 24px;
      border: 2px solid #98a8c2;
      border-bottom-width: 4px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .option-item:hover { background: rgba(255,255,255,0.04); }

    .option-item.selected {
      border-color: #0059e7;
      border-bottom-width: 4px;
      background: rgba(0,89,231,0.12);
    }
    .option-item.selected .option-num {
      border-color: #0059e7;
      color: #fff;
    }

    .option-item.correct {
      border-color: #2abc4e;
      background: rgba(55,236,101,0.12);
    }
    .option-item.correct .option-num {
      border-color: #2abc4e;
      color: #37ec65;
    }

    .option-item.incorrect {
      border-color: #f04438;
      background: rgba(240,68,56,0.12);
    }
    .option-item.incorrect .option-num {
      border-color: #f04438;
      color: #f04438;
    }

    .option-num {
      width: 32px; height: 32px;
      flex-shrink: 0;
      border: 2px solid #233d6b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 16px;
      line-height: 24px;
      color: rgba(255,255,255,0.6);
      transition: border-color 0.15s, color 0.15s;
    }

    .option-text {
      flex: 1;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: #fff;
      padding-top: 4px;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0d1a32;
      border-top: 1px solid #142a51;
      padding: 16px 24px;
      display: flex;
      justify-content: center;
    }

    .btn-confirm {
      background: #0059e7;
      border: 1px solid #0040a7;
      border-bottom-width: 5px;
      border-radius: 16px;
      height: 52px;
      width: 327px;
      max-width: 100%;
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-confirm:hover:not(:disabled) { background: #0066ff; transform: translateY(-1px); }
    .btn-confirm:active:not(:disabled) { transform: scale(0.99); }
    .btn-confirm:disabled {
      background: #1d3258;
      border-color: #1d3258;
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* ── FEEDBACK OVERLAY ── */
    .feedback-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 20px 24px 32px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .feedback-bar.show { display: flex; }
    .feedback-bar.correct-bg { background: rgba(42,188,78,0.15); border-top: 2px solid #2abc4e; }
    .feedback-bar.incorrect-bg { background: rgba(240,68,56,0.15); border-top: 2px solid #f04438; }

    .feedback-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 676px;
    }
    .feedback-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .feedback-icon.correct { background: #2abc4e; }
    .feedback-icon.incorrect { background: #f04438; }
    .feedback-label { font-weight: 700; font-size: 16px; }
    .feedback-label.correct { color: #37ec65; }
    .feedback-label.incorrect { color: #f04438; }

    .btn-next {
      background: #0059e7;
      border: 1px solid #0040a7;
      border-bottom-width: 5px;
      border-radius: 16px;
      height: 52px;
      width: 327px;
      max-width: 100%;
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-next:hover { background: #0066ff; transform: translateY(-1px); }
    .btn-next:active { transform: scale(0.99); }
    /* ── IA CONTEXT BANNER ── */
    .ia-phase-banner {
      display: flex; gap: 8px; align-items: flex-start;
      background: rgba(0,89,231,0.08); border: 1px solid rgba(0,89,231,0.25);
      border-radius: 10px; padding: 10px 12px;
      margin-bottom: 4px;
    }
    .ia-phase-banner p { font-size: 12px; line-height: 18px; color: rgba(255,255,255,0.75); }
    .ia-phase-banner strong { color: #7eb8ff; }

    /* ── IA FEEDBACK OVERLAY ── */
    .feedback-bar.correct-bg .ia-feedback-msg { color: #37ec65; }
    .feedback-bar.incorrect-bg .ia-feedback-msg { color: rgba(255,255,255,0.7); }
    .ia-feedback-msg { font-size: 12px; margin-top: 4px; font-style: italic; }
  </style>
</head>
<body>

  <!-- PHASE HEADER -->
  <div class="phase-header">
    <button class="btn-close" id="btnClose" title="Sair da fase">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill" style="width: 10%"></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="phase-template">

      <div class="ia-phase-banner" id="iaBanner">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;margin-top:1px;">
          <path d="M7 1L8.4 4.8H12.5L9.2 7.1L10.6 10.9L7 8.6L3.4 10.9L4.8 7.1L1.5 4.8H5.6L7 1Z" fill="#7eb8ff"/>
        </svg>
        <p id="iaBannerText"></p>
      </div>

      <p class="question-statement" id="questionText"></p>

      <div class="options-container" id="optionsContainer"></div>

    </div>
  </div>

  <!-- BOTTOM BAR (confirm) -->
  <div class="bottom-bar" id="bottomBar">
    <button class="btn-confirm" id="btnConfirm" disabled onclick="confirmAnswer()">Confirmar Resposta</button>
  </div>

  <!-- FEEDBACK BAR -->
  <div class="feedback-bar" id="feedbackBar">
    <div class="feedback-row">
      <div class="feedback-icon" id="feedbackIcon"></div>
      <span class="feedback-label" id="feedbackLabel"></span>
    </div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Próxima</button>
  </div>

<script>
  // ── DADOS MOCKADOS — FRAÇÕES (trilha sugerida pela IA) ──
  const QUESTIONS = [
    {
      text: 'Você viu na revisão que uma fração representa parte de um todo. Qual fração representa 3 partes de um todo dividido em 8?',
      options: [
        '8/3 — oito sobre três',
        '3/8 — três sobre oito',
        '3 × 8 — três vezes oito',
        '8 − 3 — oito menos três'
      ],
      correct: 1,
      iaMsg: '💡 Essa é a questão mais básica sobre frações. Você acabou de ver isso na revisão!'
    },
    {
      text: 'Uma pizza foi dividida em 6 fatias iguais. Maria comeu 2 fatias. Que fração da pizza Maria comeu?',
      options: [
        '6/2',
        '4/6',
        '2/6',
        '2/4'
      ],
      correct: 2,
      iaMsg: '🍕 Lembra do exemplo da pizza na revisão? Numerador = o que você comeu, denominador = total de fatias.'
    },
    {
      text: 'Qual é o NUMERADOR da fração 5/9?',
      options: [
        '9 — o número de baixo',
        '5/9 — a fração inteira',
        '14 — a soma dos dois',
        '5 — o número de cima'
      ],
      correct: 3,
      iaMsg: '📖 Revisão: numerador = número de cima = quantas partes você tem.'
    },
    {
      text: 'Em uma classe de 20 alunos, 12 foram na excursão. Qual fração da classe foi na excursão?',
      options: [
        '20/12',
        '8/20',
        '12/20',
        '12/8'
      ],
      correct: 2,
      iaMsg: '🎒 Esse tipo de problema aparece muito em provas. Numerador = o que aconteceu. Denominador = total.'
    }
  ];

  let currentIdx = 0;
  let selected   = null;
  let answered   = false;

  function loadQuestion() {
    const q = QUESTIONS[currentIdx];
    answered = false;
    selected = null;

    // progresso
    const pct = ((currentIdx) / QUESTIONS.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';

    // texto
    document.getElementById('questionText').textContent = q.text;

    // banner IA
    const banner = document.getElementById('iaBanner');
    const bannerText = document.getElementById('iaBannerText');
    if (q.iaMsg) {
      bannerText.innerHTML = q.iaMsg;
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }

    // opções
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-item';
      btn.innerHTML = `
        <div class="option-num">${i + 1}</div>
        <div class="option-text">${opt}</div>
      `;
      btn.addEventListener('click', () => selectOption(i));
      container.appendChild(btn);
    });

    // reset UI
    document.getElementById('btnConfirm').disabled = true;
    document.getElementById('bottomBar').style.display = 'flex';
    document.getElementById('feedbackBar').className = 'feedback-bar';
    document.getElementById('btnNext').textContent = 
      currentIdx < QUESTIONS.length - 1 ? 'Próxima' : 'Concluir';
  }

  function selectOption(idx) {
    if (answered) return;
    selected = idx;
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.toggle('selected', i === idx);
    });
    document.getElementById('btnConfirm').disabled = false;
  }

  function confirmAnswer() {
    if (selected === null || answered) return;
    answered = true;

    const q = QUESTIONS[currentIdx];
    const items = document.querySelectorAll('.option-item');

    items.forEach((el, i) => {
      el.classList.remove('selected');
      if (i === q.correct) el.classList.add('correct');
      else if (i === selected) el.classList.add('incorrect');
    });

    const isCorrect = selected === q.correct;
    const fb = document.getElementById('feedbackBar');
    const icon = document.getElementById('feedbackIcon');
    const label = document.getElementById('feedbackLabel');

    icon.textContent = isCorrect ? '✓' : '✗';
    icon.className = 'feedback-icon ' + (isCorrect ? 'correct' : 'incorrect');
    label.textContent = isCorrect ? 'Resposta correta!' : 'Resposta incorreta';
    label.className = 'feedback-label ' + (isCorrect ? 'correct' : 'incorrect');
    fb.className = 'feedback-bar show ' + (isCorrect ? 'correct-bg' : 'incorrect-bg');

    // IA motivational message
    const iaMsg = document.createElement('p');
    iaMsg.className = 'ia-feedback-msg';
    const correctCount = window._correctCount = (window._correctCount || 0) + (isCorrect ? 1 : 0);
    if (isCorrect) {
      const msgs = [
        '⬆️ Você está melhorando! Antes você errava isso com frequência.',
        '🎯 Exatamente isso! A revisão está fazendo efeito.',
        '✨ Ótimo! Continue assim — você está construindo memória sobre frações.',
        '🚀 Isso mesmo! Cada acerto reduz sua lacuna identificada.'
      ];
      iaMsg.textContent = msgs[currentIdx % msgs.length];
    } else {
      const msgs = [
        '💙 Tudo bem! Você pode revisar o conceito a qualquer momento.',
        '📖 Essa é exatamente a lacuna que identificamos. Não desista!',
        '🔄 Erros são parte do aprendizado. A IA vai reforçar esse ponto.',
        '💡 Olha de novo o exemplo da revisão — vai ajudar!'
      ];
      iaMsg.textContent = msgs[currentIdx % msgs.length];
    }

    // Remove msg anterior se existir
    const oldMsg = fb.querySelector('.ia-feedback-msg');
    if (oldMsg) oldMsg.remove();

    const btnNext = document.getElementById('btnNext');
    fb.insertBefore(iaMsg, btnNext);

    document.getElementById('bottomBar').style.display = 'none';
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < QUESTIONS.length) {
      loadQuestion();
    } else {
      location.href = 'trilha-concluida.html';
    }
  }

  document.getElementById('btnClose').addEventListener('click', () => {
    location.href = 'trilha-em-andamento.html';
  });

  // Inicializa
  loadQuestion();
</script>
</body>
</html>
