<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbie App - Desempenho</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="performance-page">
        <!-- Header -->
        <div class="performance-header">
            <button class="back-button" onclick="goBack()">
                <img src="https://www.figma.com/api/mcp/asset/c6dc80a9-7029-4783-897f-7f19919ca816" alt="Voltar">
                <span>Voltar</span>
            </button>
            <h1 class="performance-title">Desempenho</h1>
        </div>

        <!-- Conteúdo -->
        <div class="performance-content">
            <!-- HUD de estatísticas -->
            <div class="performance-hud">
                <div class="experience-badge">
                    <span class="xp-large">450 XP</span>
                </div>
                
                <div class="experience-progress">
                    <p class="experience-description">Próximo nível em 150 XP</p>
                    <div class="progress-bar-large">
                        <div class="progress-fill-large" style="width: 75%"></div>
                    </div>
                    <p class="experience-level">Nível 3 • Explorador</p>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-number">2</span>
                        <span class="stat-label">Trilhas Concluídas</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">80%</span>
                        <span class="stat-label">Performance Geral</span>
                    </div>
                </div>
            </div>

            <!-- Trilhas realizadas -->
            <div class="completed-section">
                <h2 class="section-title">Trilhas Realizadas</h2>
                
                <div class="completed-trail">
                    <div class="trail-info">
                        <h3 class="trail-name">Cadeias Alimentares e Ecossistemas</h3>
                        <p class="trail-subject">Ciências • Matemática</p>
                        <div class="trail-stats">
                            <span class="trail-score">8/10 acertos</span>
                            <span class="trail-xp">+100 XP</span>
                        </div>
                    </div>
                    <div class="trail-performance">
                        <div class="performance-ring">
                            <svg width="60" height="60" viewBox="0 0 60 60">
                                <circle cx="30" cy="30" r="25" stroke="#1d3258" stroke-width="4" fill="none"/>
                                <circle cx="30" cy="30" r="25" stroke="#32d583" stroke-width="4" fill="none"
                                    stroke-dasharray="157" stroke-dashoffset="31.4" transform="rotate(-90 30 30)"/>
                            </svg>
                            <span class="performance-percentage">80%</span>
                        </div>
                    </div>
                </div>

                <div class="completed-trail">
                    <div class="trail-info">
                        <h3 class="trail-name">Cadeia Alimentar Terrestre</h3>
                        <p class="trail-subject">Biologia</p>
                        <div class="trail-stats">
                            <span class="trail-score">9/10 acertos</span>
                            <span class="trail-xp">+120 XP</span>
                        </div>
                    </div>
                    <div class="trail-performance">
                        <div class="performance-ring">
                            <svg width="60" height="60" viewBox="0 0 60 60">
                                <circle cx="30" cy="30" r="25" stroke="#1d3258" stroke-width="4" fill="none"/>
                                <circle cx="30" cy="30" r="25" stroke="#32d583" stroke-width="4" fill="none"
                                    stroke-dasharray="157" stroke-dashoffset="15.7" transform="rotate(-90 30 30)"/>
                            </svg>
                            <span class="performance-percentage">90%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = 'index.html';
        }

        // Animação dos anéis de performance
        function animateRings() {
            const rings = document.querySelectorAll('.performance-ring svg circle:last-child');
            rings.forEach(ring => {
                const dashArray = ring.getAttribute('stroke-dasharray');
                const dashOffset = ring.getAttribute('stroke-dashoffset');
                
                ring.style.strokeDashoffset = dashArray;
                
                setTimeout(() => {
                    ring.style.transition = 'stroke-dashoffset 1s ease-in-out';
                    ring.style.strokeDashoffset = dashOffset;
                }, 500);
            });
        }

        // Executar animação quando a página carregar
        window.addEventListener('load', animateRings);
    </script>
</body>
</html>
