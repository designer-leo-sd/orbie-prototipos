<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Mapa de Etapas — Orbie App</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-top:    #06015D;
      --bg-bot:    #790097;
      --surface:   #142A51;
      --border:    #2A1B6A;
      --primary:   #0059E7;
      --primary-h: #3F84F3;
      --green:     #12B76A;
      --yellow:    #FFEA24;
      --orange:    #F79009;
      --star-off:  #526D98;
      --locked:    #2A2060;
      --nav-h:     64px;
      --nav-m:     24px;
      --max-w:     460px; /* mobile-first, centered */
    }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', sans-serif;
      color: #fff;
      background: linear-gradient(180deg, #06015D 0%, #790097 86%, #790097 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── STARS BG ── */
    .bg-stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 10%  8%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px   1px   at 28% 15%, rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(2px   2px   at 52%  4%, rgba(255,255,255,.9)  0%, transparent 100%),
        radial-gradient(1px   1px   at 75% 12%, rgba(255,255,255,.6)  0%, transparent 100%),
        radial-gradient(1px   1px   at 90%  6%, rgba(255,255,255,.7)  0%, transparent 100%),
        radial-gradient(1px   1px   at 15% 40%, rgba(255,255,255,.4)  0%, transparent 100%),
        radial-gradient(1px   1px   at 60% 35%, rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(1px   1px   at 85% 55%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px   1px   at 40% 70%, rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1px   1px   at 20% 80%, rgba(255,255,255,.35) 0%, transparent 100%);
    }

    /* ── METEORS ── */
    .meteors { position: fixed; top: 0; left: 0; right: 0; height: 200px;
      z-index: 1; pointer-events: none; overflow: hidden; }
    @keyframes mh {
      0%   { transform: translateX(110vw); opacity: 0; }
      5%   { opacity: .8; }
      95%  { opacity: .6; }
      100% { transform: translateX(-15vw); opacity: 0; }
    }
    .rock { position: absolute; border-radius: 40%;
      background: radial-gradient(ellipse at 35% 35%, #C0CADB 0%, #7187A9 50%, #31558A 100%);
      animation: mh linear infinite; }
    .r1{width:8px;height:10px;top:20px;animation-duration:18s;animation-delay:0s}
    .r2{width:22px;height:27px;top:80px;animation-duration:18s;animation-delay:7s;opacity:.7}
    .r3{width:40px;height:41px;top:40px;animation-duration:18s;animation-delay:13s;opacity:.8}

    /* ══════════════════════════════════════
       APP LAYOUT — two-column on desktop,
       single scroll on mobile
    ══════════════════════════════════════ */
    .app {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: calc(var(--nav-h) + var(--nav-m)*2 + 80px);
    }

    /* ── LOGO BAR ── */
    .logo-bar {
      width: 100%; max-width: 928px;
      padding: 28px 24px 36px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-spacer { width: 40px; }
    .orbie-logo {
      display: flex; align-items: center; cursor: pointer;
      filter: drop-shadow(0 0 14px rgba(255,255,255,.5));
    }
    .orbie-logo svg { height: 22px; width: auto; overflow: visible; }
    .notif-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s; position: relative;
    }
    .notif-btn:hover { background: rgba(255,255,255,.15); }
    .notif-dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px;
      background: var(--orange); border-radius: 50%; }

    /* ── PLANET SELECTOR TABS ── */
    .planet-tabs {
      display: flex; gap: 10px;
      padding: 0 24px 32px;
      width: 100%; max-width: 928px;
    }
    .planet-tab {
      flex: 1; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      cursor: pointer; transition: all .2s;
      max-width: 220px;
    }
    .planet-tab:hover { background: rgba(255,255,255,.09); }
    .planet-tab.active {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.35);
      box-shadow: 0 0 20px rgba(255,255,255,.08);
    }
    .tab-globe { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .tab-info { min-width: 0; }
    .tab-name { font-family: 'Orbitron', sans-serif; font-size: 11px;
      font-weight: 700; color: #fff; letter-spacing: .5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-status { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }
    .tab-stars { display: flex; gap: 2px; margin-top: 3px; }
    .ts-on  { color: var(--yellow); font-size: 10px; }
    .ts-off { color: var(--star-off); font-size: 10px; }

    /* ══════════════════════════════════════
       PLANET HEADER — nome + barra geral
    ══════════════════════════════════════ */
    .planet-header {
      width: 100%; max-width: var(--max-w);
      padding: 0 24px 28px;
    }
    .planet-header-card {
      border: 1.5px solid rgba(255,255,255,.25);
      border-radius: 16px;
      padding: 16px 20px;
      background: rgba(255,255,255,.04);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .ph-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; font-weight: 700;
      color: var(--yellow); letter-spacing: 2px; text-transform: uppercase;
    }
    .ph-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 17px; font-weight: 700; color: #fff;
    }
    .ph-progress-wrap { width: 100%; display: flex; align-items: center; gap: 10px; }
    .ph-bar { flex: 1; height: 5px; background: rgba(255,255,255,.12); border-radius: 100px; overflow: hidden; }
    .ph-bar-fill { height: 100%; border-radius: 100px; background: var(--green); transition: width .8s ease-out; }
    .ph-pct { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.5); }

    /* ══════════════════════════════════════
       ETAPAS MAP — vertical scroll, Brilliant style
       Orbs alternados esq/dir no eixo central
    ══════════════════════════════════════ */
    .map-wrap {
      width: 100%; max-width: var(--max-w);
      padding: 0 24px;
      position: relative;
    }

    /* Linha conectora vertical central */
    .map-spine {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.2) 50%, rgba(255,255,255,.08) 100%);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .map-list {
      display: flex; flex-direction: column;
      gap: 0; position: relative; z-index: 1;
    }

    /* ── ETAPA NODE ── */
    .etapa-node {
      display: flex;
      align-items: center;
      min-height: 110px;
      position: relative;
      cursor: pointer;
    }
    /* Alternância: par → orb à esquerda, label à direita */
    .etapa-node.side-left  { flex-direction: row; }
    .etapa-node.side-right { flex-direction: row-reverse; }

    /* Linha de conector do orb até a spine */
    .etapa-node::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      height: 2px;
      background: rgba(255,255,255,.15);
      transform: translateY(-50%);
      pointer-events: none;
      width: 15%;
    }
    .etapa-node.side-left::before  { transform: translateY(-50%) translateX(-100%); }
    .etapa-node.side-right::before { transform: translateY(-50%); }

    /* ── ORB ── (inspirado nos discos do Brilliant) */
    .orb-wrap {
      width: 50%; display: flex;
      flex-shrink: 0;
    }
    .side-left  .orb-wrap { justify-content: flex-start; padding-left: 8px; }
    .side-right .orb-wrap { justify-content: flex-end;   padding-right: 8px; }

    .orb {
      width: 80px; height: 50px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: transform .25s ease;
    }
    .orb:hover { transform: translateY(-4px); }
    .etapa-node.active .orb { transform: translateY(-6px); }

    /* Disco base (perspectiva 3D achatada) */
    .orb-disk {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 72px; height: 22px;
      border-radius: 50%;
    }
    /* Ícone/face acima do disco */
    .orb-icon {
      position: absolute;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      z-index: 2;
    }

    /* ── STATUS: done ── */
    .etapa-node.done .orb-disk {
      background: radial-gradient(ellipse at 50% 30%, rgba(18,183,106,.7) 0%, rgba(8,80,45,.9) 100%);
      box-shadow: 0 0 18px rgba(18,183,106,.5), inset 0 1px 0 rgba(255,255,255,.2);
    }
    .etapa-node.done .orb-icon {
      background: linear-gradient(135deg, #1adf82, #0e9955);
      box-shadow: 0 4px 16px rgba(18,183,106,.5);
    }
    /* ── STATUS: active ── */
    .etapa-node.active .orb-disk {
      background: radial-gradient(ellipse at 50% 30%, rgba(255,234,36,.85) 0%, rgba(140,100,0,.95) 100%);
      box-shadow: 0 0 28px rgba(255,234,36,.65), 0 0 60px rgba(255,234,36,.25), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .etapa-node.active .orb-icon {
      background: linear-gradient(135deg, #FFE44A, #E8A800);
      box-shadow: 0 4px 20px rgba(255,234,36,.6), 0 0 40px rgba(255,200,0,.3);
    }
    /* Glow pulse no orb ativo */
    @keyframes orb-glow {
      0%,100% { box-shadow: 0 0 28px rgba(255,234,36,.65), 0 0 60px rgba(255,234,36,.25), inset 0 1px 0 rgba(255,255,255,.3); }
      50%      { box-shadow: 0 0 40px rgba(255,234,36,.9),  0 0 80px rgba(255,234,36,.4),  inset 0 1px 0 rgba(255,255,255,.3); }
    }
    .etapa-node.active .orb-disk { animation: orb-glow 2s ease-in-out infinite; }

    /* ── STATUS: locked ── */
    .etapa-node.locked .orb-disk {
      background: radial-gradient(ellipse at 50% 30%, rgba(70,60,100,.8) 0%, rgba(20,15,40,.95) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .etapa-node.locked .orb-icon {
      background: linear-gradient(135deg, #3A3060, #20183A);
      box-shadow: none;
    }
    .etapa-node.locked { opacity: .55; cursor: default; }

    /* ── LABEL (lado oposto ao orb) ── */
    .etapa-label {
      width: 50%;
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: 4px;
    }
    .side-left  .etapa-label { padding-left: 20px; align-items: flex-start; }
    .side-right .etapa-label { padding-right: 20px; align-items: flex-end; text-align: right; }

    .etapa-label-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; font-weight: 700;
      color: rgba(255,255,255,.35);
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .etapa-label-name {
      font-weight: 700; font-size: 13px; color: #fff; line-height: 1.3;
    }
    .etapa-node.locked .etapa-label-name { color: rgba(255,255,255,.35); }

    /* Mini progress dots (fase indicators) */
    .etapa-dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
    .side-right .etapa-dots { justify-content: flex-end; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      transition: background .3s;
    }
    .dot.filled { background: var(--green); }
    .dot.current { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .dot.empty  { background: rgba(255,255,255,.15); }
    .dot.locked-dot { background: rgba(255,255,255,.08); }

    /* ══════════════════════════════════════
       BOTTOM SHEET — painel fixo, estilo Brilliant
       Aparece ao selecionar um orb
    ══════════════════════════════════════ */
    .bottom-sheet {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--nav-m)*2 + 8px);
      left: 50%; transform: translateX(-50%) translateY(120%);
      width: calc(100% - 48px); max-width: var(--max-w);
      background: rgba(22, 18, 60, 0.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 20px 20px 20px;
      z-index: 98;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 -8px 40px rgba(0,0,0,.4);
    }
    .bottom-sheet.visible {
      transform: translateX(-50%) translateY(0);
    }
    .bs-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .bs-orb-mini {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .bs-orb-mini.done   { background: linear-gradient(135deg,#1adf82,#0e9955); }
    .bs-orb-mini.active { background: linear-gradient(135deg,#FFE44A,#E8A800); }
    .bs-orb-mini.locked { background: linear-gradient(135deg,#3A3060,#20183A); }
    .bs-text { flex: 1; min-width: 0; }
    .bs-tag {
      font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 3px;
    }
    .bs-tag.done   { color: var(--green); }
    .bs-tag.active { color: var(--yellow); }
    .bs-tag.locked { color: var(--star-off); }
    .bs-name { font-weight: 700; font-size: 16px; color: #fff; }
    .bs-phases { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 2px; }

    /* Progress in sheet */
    .bs-bar-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .bs-bar { flex: 1; height: 6px; background: rgba(255,255,255,.1); border-radius: 100px; overflow: hidden; }
    .bs-bar-fill { height: 100%; border-radius: 100px; transition: width .6s ease-out; }
    .bs-bar-fill.done   { background: var(--green); }
    .bs-bar-fill.active { background: var(--yellow); }
    .bs-bar-fill.locked { background: rgba(255,255,255,.1); }
    .bs-pct { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.45); }

    /* CTA button */
    .bs-btn {
      width: 100%; padding: 14px;
      border-radius: 12px; border: none;
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .bs-btn:hover  { opacity: .9; transform: translateY(-1px); }
    .bs-btn:active { transform: scale(.98); }
    .bs-btn.done   { background: var(--green); color: #fff; }
    .bs-btn.active { background: var(--yellow); color: #1a1000; }
    .bs-btn.locked { background: rgba(255,255,255,.08); color: rgba(255,255,255,.3); cursor: default; }

    /* ── CONTINUE CARD ── */
    .continue-wrap {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--nav-m)*2 + 8px);
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 928px;
      z-index: 97; pointer-events: none;
      transition: opacity .3s;
    }
    .continue-wrap.hidden-by-sheet { opacity: 0; pointer-events: none; }
    .continue-card {
      background: rgba(0,0,0,.6); backdrop-filter: blur(58px);
      border-radius: 12px; padding: 16px;
      display: flex; align-items: center; gap: 16px;
      cursor: pointer; pointer-events: all; transition: background .2s;
    }
    .continue-card:hover { background: rgba(0,0,0,.75); }
    .cc-thumb { height: 44px; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(255,255,255,.7)); }
    .cc-info { flex: 1; min-width: 0; }
    .cc-title { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 6px; }
    .cc-bc { font-size: 12px; color: rgba(255,255,255,.5);
      display: flex; align-items: center; gap: 4px; }
    .btn-fab {
      background: var(--primary); border: 1px solid #0040A7;
      border-bottom-width: 4px; border-radius: 12px; padding: 10px 20px;
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px;
      color: #fff; cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    .btn-fab:hover { background: var(--primary-h); transform: translateY(-1px); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: var(--nav-m); left: 50%; transform: translateX(-50%);
      width: calc(100% - var(--nav-m)*2); max-width: 928px;
      height: var(--nav-h); background: #142A51; border-radius: 12px;
      padding: 4px; display: flex; align-items: stretch; z-index: 100;
    }
    .nav-item {
      flex: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 12px; border: none; background: transparent;
      cursor: pointer; padding: 8px 12px; gap: 0; transition: background .2s;
    }
    .nav-item.active { background: var(--primary); }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,.06); }
    @media (min-width: 600px) {
      .nav-label { font-family: 'Orbitron', sans-serif; font-size: 11px;
        font-weight: 700; color: #fff; margin-left: 16px; white-space: nowrap; }
    }
    @media (max-width: 599px) { .nav-label { display: none; } }

    /* ── RESPONSIVE ── */
    @media (max-width: 540px) {
      .planet-tabs { flex-direction: column; }
      .planet-tab  { max-width: 100%; }
    }
  </style>
</head>
<body>
<div class="bg-stars"></div>
<div class="meteors">
  <div class="rock r1"></div><div class="rock r2"></div><div class="rock r3"></div>
</div>

<div class="app">
  <!-- LOGO BAR -->
  <div class="logo-bar">
    <div class="logo-spacer"></div>

<script>
/* ══════════════════════════════════════
   DADOS MOCKADOS — 2 planetas com etapas
══════════════════════════════════════ */
const PLANETS = [
  {
    id: 0, name: 'Arithmos', label: 'Planeta 1', progress: 42,
    etapas: [
      { id:1, name:'Números Naturais',    icon:'🔢', status:'done',   phases:8,  done:8  },
      { id:2, name:'Operações Básicas',   icon:'➕', status:'done',   phases:6,  done:6  },
      { id:3, name:'Frações e Proporções',icon:'➗', status:'active', phases:7,  done:4  },
      { id:4, name:'Geometria Plana',     icon:'📐', status:'locked', phases:8,  done:0  },
      { id:5, name:'Álgebra Fundamental', icon:'🔣', status:'locked', phases:6,  done:0  },
    ]
  },
  {
    id: 1, name: 'Bios', label: 'Planeta 2', progress: 12,
    etapas: [
      { id:1, name:'Seres Vivos',    icon:'🌿', status:'done',   phases:5, done:5 },
      { id:2, name:'Cadeia Alimentar',icon:'🦁', status:'active', phases:5, done:1 },
      { id:3, name:'Ecossistemas',   icon:'🌍', status:'locked', phases:6, done:0 },
      { id:4, name:'Corpo Humano',   icon:'🫀', status:'locked', phases:7, done:0 },
    ]
  }
];

let currentPlanet = 0;
let selectedEtapa  = null;

/* ── Renderiza o mapa de etapas ── */
function renderMap(planetIdx) {
  const planet = PLANETS[planetIdx];
  const list   = document.getElementById('mapList');
  list.innerHTML = '';

  planet.etapas.forEach((etapa, i) => {
    const side = i % 2 === 0 ? 'side-left' : 'side-right';
    const pct  = etapa.phases > 0 ? Math.round((etapa.done / etapa.phases) * 100) : 0;

    /* dots de fases */
    let dotsHtml = '';
    for (let d = 0; d < etapa.phases; d++) {
      let cls = 'dot locked-dot';
      if (etapa.status === 'done')   cls = 'dot filled';
      else if (etapa.status === 'active') {
        cls = d < etapa.done ? 'dot filled' : (d === etapa.done ? 'dot current' : 'dot empty');
      }
      dotsHtml += `<div class="${cls}"></div>`;
    }

    const labelSide = side === 'side-left' ? 'side-right' : 'side-left';

    const node = document.createElement('div');
    node.className = `etapa-node ${etapa.status} ${side}`;
    node.dataset.idx = i;
    node.innerHTML = `
      <div class="orb-wrap">
        <div class="orb" role="button" aria-label="${etapa.name}">
          <div class="orb-disk"></div>
          <div class="orb-icon">${etapa.icon}</div>
        </div>
      </div>
      <div class="etapa-label">
        <div class="etapa-label-num">Etapa ${etapa.id}</div>
        <div class="etapa-label-name">${etapa.name}</div>
        <div class="etapa-dots">${dotsHtml}</div>
      </div>`;

    if (etapa.status !== 'locked') {
      node.addEventListener('click', () => selectEtapa(planetIdx, i));
    }
    list.appendChild(node);
  });

  /* Auto-seleciona a etapa ativa */
  const activeIdx = planet.etapas.findIndex(e => e.status === 'active');
  if (activeIdx >= 0) selectEtapa(planetIdx, activeIdx, false);
}

/* ── Seleciona uma etapa → abre bottom sheet ── */
function selectEtapa(planetIdx, etapaIdx, animate = true) {
  const planet = PLANETS[planetIdx];
  const etapa  = planet.etapas[etapaIdx];
  selectedEtapa = etapaIdx;

  /* Destaca o node */
  document.querySelectorAll('.etapa-node').forEach(n => n.classList.remove('selected'));
  const nodes = document.querySelectorAll('.etapa-node');
  if (nodes[etapaIdx]) nodes[etapaIdx].classList.add('selected');

  const pct = etapa.phases > 0 ? Math.round((etapa.done / etapa.phases) * 100) : 0;

  /* Preenche bottom sheet */
  const sheet = document.getElementById('bottomSheet');
  const mini  = document.getElementById('bsOrbMini');
  const tag   = document.getElementById('bsTag');
  const name  = document.getElementById('bsName');
  const phases= document.getElementById('bsPhases');
  const fill  = document.getElementById('bsBarFill');
  const pctEl = document.getElementById('bsPct');
  const btn   = document.getElementById('bsBtn');

  mini.textContent  = etapa.icon;
  mini.className    = `bs-orb-mini ${etapa.status}`;
  name.textContent  = etapa.name;
  tag.className     = `bs-tag ${etapa.status}`;
  fill.className    = `bs-bar-fill ${etapa.status}`;

  const statusLabel = { done:'Concluída', active:'Em andamento', locked:'Bloqueada' };
  const btnLabel    = { done:'Rever conteúdo', active:'Continuar', locked:'Bloqueada' };
  tag.textContent   = statusLabel[etapa.status];
  phases.textContent= `${etapa.done} de ${etapa.phases} fases concluídas`;
  btn.textContent   = btnLabel[etapa.status];
  btn.className     = `bs-btn ${etapa.status}`;

  /* Anima a barra */
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.width = pct + '%';
    pctEl.textContent = pct + '%';
  }));

  /* Mostra sheet */
  sheet.classList.add('visible');
  document.getElementById('continueWrap').classList.add('hidden-by-sheet');
}

/* ── Fecha o bottom sheet ao clicar fora ── */
document.addEventListener('click', e => {
  const sheet = document.getElementById('bottomSheet');
  if (!sheet.contains(e.target) && !e.target.closest('.etapa-node')) {
    sheet.classList.remove('visible');
    document.getElementById('continueWrap').classList.remove('hidden-by-sheet');
    document.querySelectorAll('.etapa-node').forEach(n => n.classList.remove('selected'));
    selectedEtapa = null;
  }
});

/* ── Troca de planeta ── */
function selectPlanet(idx) {
  currentPlanet = idx;
  const planet  = PLANETS[idx];

  /* Atualiza tabs */
  document.querySelectorAll('.planet-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });

  /* Atualiza header */
  document.getElementById('ph-label').textContent = planet.label;
  document.getElementById('ph-name').textContent  = planet.name;
  const fill = document.getElementById('ph-fill');
  fill.style.width = '0%';
  setTimeout(() => { fill.style.width = planet.progress + '%'; }, 50);
  document.getElementById('ph-pct').textContent = planet.progress + '%';

  /* Fecha sheet e rerenderiza */
  document.getElementById('bottomSheet').classList.remove('visible');
  document.getElementById('continueWrap').classList.remove('hidden-by-sheet');
  renderMap(idx);
}

/* ── Nav switching ── */
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

/* ── Init ── */
renderMap(0);
setTimeout(() => {
  document.getElementById('ph-fill').style.width = '42%';
}, 200);
</script>
