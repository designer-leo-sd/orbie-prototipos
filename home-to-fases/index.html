<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Orbie App</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─────────────── TOKENS (design_orbie_app.md) ─────────────── */
    :root {
      --bg-home:          #3A00A8;   /* semantic/background-home   */
      --bg-dark:          #0D1A32;   /* semantic/background-splash */
      --surface-card:     #142A51;   /* semantic/surface-card      */
      --surface-dark:     #10203D;   /* semantic/surface-card-dark */
      --border:           #224476;   /* semantic/border-default    */
      --primary:          #0059E7;   /* semantic/cta-primary       */
      --primary-100:      #99C0FF;   /* brand-blue-100             */
      --primary-200:      #3F84F3;   /* brand-blue-200             */
      --primary-hover:    #3F84F3;
      --primary-400:      #0040A7;
      --green-300:        #2ABC4E;
      --green-400:        #12B76A;
      --yellow-100:       #FFEA24;   /* semantic/star-active       */
      --star-inactive:    #526D98;   /* semantic/star-inactive     */
      --locked-icon:      #526D98;
      --text-primary:     #FFFFFF;
      --text-secondary:   #99C0FF;
      --text-label:       #C0CADB;
      --orange-400:       #F79009;
      --nav-height:       64px;
      --nav-margin:       24px;
      --nav-radius:       12px;
      --max-content:      928px;     /* maxWidthContent Flutter */
    }

    /* ─────────────── BASE ─────────────── */
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-home);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ─────────────── BACKGROUND LAYER ─────────────── */
    /*
     * Flutter: GradientBackground(type: home)
     * colors: [palletsBackgroundTop, palletsBackgroundBottom]
     *   _OrbieColors: palletsBackgroundTop  = 0xff06015D  →  #06015D
     *                 palletsBackgroundBottom = 0xff790097 →  #790097
     * stops: [0.0, 0.86]
     * begin: Alignment.topCenter, end: FractionalOffset.bottomCenter
     * O último 14% (0.86→1.0) continua na cor final sem novo stop.
     */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(
        180deg,
        #06015D  0%,    /* palletsBackgroundTop  */
        #790097 86%,    /* palletsBackgroundBottom (stop = 0.86) */
        #790097 100%    /* mantém a cor final no restante */
      );
    }

    /* Stars overlay (details_home.svg — small bright dots) */
    .bg-stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at  8% 6%,  rgba(255,255,255,0.85) 0%, transparent 100%),
        radial-gradient(1px   1px   at 18% 14%, rgba(255,255,255,0.6)  0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 30% 4%,  rgba(255,255,255,0.75) 0%, transparent 100%),
        radial-gradient(1px   1px   at 42% 10%, rgba(255,255,255,0.5)  0%, transparent 100%),
        radial-gradient(2px   2px   at 55% 3%,  rgba(255,255,255,0.9)  0%, transparent 100%),
        radial-gradient(1px   1px   at 65% 18%, rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 8%,  rgba(255,255,255,0.7)  0%, transparent 100%),
        radial-gradient(1px   1px   at 88% 15%, rgba(255,255,255,0.5)  0%, transparent 100%),
        radial-gradient(1px   1px   at 95% 5%,  rgba(255,255,255,0.65) 0%, transparent 100%),
        radial-gradient(1px   1px   at  5% 28%, rgba(255,255,255,0.45) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 22% 35%, rgba(255,255,255,0.6)  0%, transparent 100%),
        radial-gradient(1px   1px   at 48% 22%, rgba(255,255,255,0.5)  0%, transparent 100%),
        radial-gradient(1px   1px   at 72% 32%, rgba(255,255,255,0.45) 0%, transparent 100%),
        radial-gradient(1px   1px   at 91% 25%, rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1px   1px   at 12% 50%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 36% 55%, rgba(255,255,255,0.4)  0%, transparent 100%),
        radial-gradient(1px   1px   at 58% 48%, rgba(255,255,255,0.45) 0%, transparent 100%),
        radial-gradient(1px   1px   at 82% 58%, rgba(255,255,255,0.35) 0%, transparent 100%);
    }

    /* ─────────────── METEORS HORIZONTAL (MeteorsHorizontal Flutter) ─────────────── */
    /*
     * 5 rocks (SVG): traverse right→left across screen in 20s (duration: 20000ms Flutter)
     * Sizes real: rock1=9×11, rock2=9×12, rock3=24×30, rock4=43×44, rock5=53×54
     * Here represented as SVG ellipses with varying sizes, staggered
     */
    .meteors-layer {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 320px;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    @keyframes meteor-h {
      0%   { transform: translateX(110vw); opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 0.7; }
      100% { transform: translateX(-15vw); opacity: 0; }
    }
    .meteor-rock {
      position: absolute;
      border-radius: 40%;
      background: radial-gradient(ellipse at 35% 35%, #C0CADB 0%, #7187A9 50%, #31558A 100%);
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4);
      animation: meteor-h linear infinite;
    }
    /* Rock 5 — largest (53px) */
    .rock-5 { width: 53px; height: 53px; top: 22px;  animation-duration: 20s; animation-delay: 0s; }
    /* Rock 4 — large (43px) */
    .rock-4 { width: 43px; height: 44px; top: 99px;  animation-duration: 20s; animation-delay: 4s; opacity: 0.85; }
    /* Rock 3 — medium (24px) */
    .rock-3 { width: 24px; height: 30px; top: 175px; animation-duration: 20s; animation-delay: 8s; opacity: 0.75; }
    /* Rock 2 — small (9×12) */
    .rock-2 { width: 9px;  height: 12px; top: 185px; animation-duration: 20s; animation-delay: 12s; opacity: 0.7; }
    /* Rock 1 — tiny (9×11) */
    .rock-1 { width: 9px;  height: 11px; top: 22px;  animation-duration: 20s; animation-delay: 16s; opacity: 0.65; }

    /* ─────────────── ROCKS oscillating (MeteorsRocks — bottom area) ─────────────── */
    /*
     * Flutter: Padding top:300, 19 rocks oscillate vertically (reverse:true, 3s)
     * Simplified: a cluster of rocks floating at the bottom of the screen
     */
    .rocks-bottom {
      position: fixed;
      bottom: calc(var(--nav-height) + var(--nav-margin) * 2);
      left: 0; right: 0;
      height: 180px;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    @keyframes rock-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-18px); }
    }
    .rock-dot {
      position: absolute;
      border-radius: 40%;
      background: radial-gradient(ellipse at 35% 30%, #4A3070 0%, #250050 60%, #120028 100%);
      box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5);
      animation: rock-float ease-in-out infinite;
    }

    /* ─────────────── APP LAYOUT ─────────────── */
    .app {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-height) + var(--nav-margin) * 2 + 12px);
    }

    /* ─────────────── ORBIE LOGO (top center) ─────────────── */
    /*
     * Flutter: OrbieLogo(size: small, glow: enabled, type: logo)
     * Row(spaceBetween): hidden-NotifButton | Logo | NotifButton
     * Logo = orbie_shining.svg (icon) + orbie_text.svg (wordmark)
     */
    .logo-bar {
      width: 100%;
      max-width: var(--max-content);
      margin: 0 auto;
      padding: 28px 24px 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-spacer { width: 40px; }
    .orbie-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      /* glow effect (OrbieLogoGlow.enabled) */
      filter: drop-shadow(0 0 16px rgba(255,255,255,0.55)) drop-shadow(0 0 6px rgba(255,255,255,0.4));
    }
    .orbie-logo-icon  { height: 40px; width: auto; overflow: visible; }
    .orbie-logo-text  { height: 23px; width: auto; overflow: visible; }

    .notif-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
      flex-shrink: 0;
    }
    .notif-btn:hover { background: rgba(255,255,255,0.15); }
    .notif-dot {
      position: absolute;
      top: 6px; right: 7px;
      width: 9px; height: 9px;
      background: var(--orange-400);
      border-radius: 50%;
      border: 2px solid transparent;
    }

    /* ─────────────── CONTINUE CARD (CardJumpToChallenge) ─────────────── */
    /*
     * Flutter: colocado em _AnimationBackground bottomCenter
     * Fica fixo na parte inferior, logo ACIMA da bottom nav
     * padding: 16, background: transparenceBlack60 + backdrop blur
     */
    .continue-wrap {
      position: fixed;
      bottom: calc(var(--nav-height) + var(--nav-margin) * 2 + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: var(--max-content);
      z-index: 99;
      pointer-events: none;
    }
    .continue-card {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(57.7px);
      -webkit-backdrop-filter: blur(57.7px);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: background 0.2s;
      pointer-events: all;
    }
    .continue-card:hover { background: rgba(0,0,0,0.72); }

    .continue-planet-thumb {
      height: 44px;
      width: auto;
      flex-shrink: 0;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
    }
    .continue-planet-thumb svg { height: 44px; width: auto; }

    .continue-info { flex: 1; min-width: 0; overflow: hidden; }
    .continue-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      margin-bottom: 8px;
      white-space: nowrap;
    }
    .continue-breadcrumb {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .continue-breadcrumb .arrow {
      font-size: 10px;
      opacity: 0.6;
    }

    /* ButtonFab — "Continuar" */
    .btn-fab {
      background: var(--primary);
      border: 1px solid var(--primary-400);
      border-bottom-width: 4px;
      border-radius: 12px;
      padding: 10px 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-fab:hover  { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-fab:active { transform: scale(0.98); }

    /* ─────────────── PLANET LIST ─────────────── */
    /*
     * Flutter: Column of _CardPlaneta widgets, paddingBottom: 64 each
     * Each card: Row(mainAxis: end/start based on index)
     * index 0 → position RIGHT (planeta à dir, info à esq) — mainAxis: end
     * index 1 → position LEFT  (info à dir, planeta à esq) — mainAxis: start
     *
     * Planet constrained: maxWidth = min(screenWidth, maxWidthContent) / 2.5
     * = 928 / 2.5 ≈ 371px on desktop
     */
    .planets-list {
      width: 100%;
      max-width: var(--max-content);
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .planet-row {
      display: flex;
      align-items: center;
      padding-bottom: 64px;  /* Flutter: paddingBottom: 64 */
      width: 100%;
      /* paddingInside from position: right→ paddingRight:24, left→ paddingLeft:24 */
    }
    /* index 0 → position RIGHT → mainAxis: end (planet on right, info on left) */
    .planet-row.pos-right {
      justify-content: flex-end;
      padding-right: 24px;
    }
    /* index 1 → position LEFT → mainAxis: start (planet on left, info on right) */
    .planet-row.pos-left {
      justify-content: flex-start;
      padding-left: 24px;
    }

    .planet-row-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s;
      padding: 8px;
    }
    .planet-row-inner:hover { background: rgba(255,255,255,0.04); }
    .planet-row-inner:active { transform: scale(0.99); }

    /* ── Planet Globe + animations ── */
    .planet-globe-wrap {
      position: relative;
      /* maxWidth/height: min(928, screenW) / 2.5 ≈ 371px on desktop, constrained */
      width: min(371px, 38vw);
      height: min(371px, 38vw);
      flex-shrink: 0;
    }

    /* PulseTwoAnimation — only on active planet */
    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 0.45; }
      70%  { transform: scale(1.25); opacity: 0;    }
      100% { transform: scale(1.25); opacity: 0;    }
    }
    .pulse-ring {
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      animation: pulse-ring 2s ease-out infinite;
      pointer-events: none;
    }
    .pulse-ring-2 { animation-delay: 1s; }

    .planet-svg {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: block;
      transition: transform 0.3s ease;
      /* ZoomOnHover in Flutter */
    }
    .planet-row-inner:hover .planet-svg { transform: scale(1.03); }

    /* SIG mascot overlay — RoboFaceTwoAnimation: centered on planet, size = planetW/3 */
    .sig-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }
    .sig-face {
      width: 33.3%;  /* planetW / 3 */
      height: auto;
      position: relative;
    }
    @keyframes sig-blink {
      0%, 45%, 55%, 100% { opacity: 1; }
      48%, 52%           { opacity: 0.1; }
    }
    @keyframes sig-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }
    .sig-face { animation: sig-float 2.5s ease-in-out infinite; }

    /* Lock animation — LockAnimation for locked planets */
    .lock-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    /* ── Planet Identification widget ── */
    .planet-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    /* index 0 → pos LEFT  → info aligns right (planet left, info right) */
    .pos-left  .planet-info { align-items: flex-end;   text-align: right; }
    /* index 1 → pos RIGHT → info aligns left  (info left, planet right) */
    .pos-right .planet-info { align-items: flex-start; text-align: left; }

    .planet-name {
      /* OrbieStyles.bodyRobotoSubtituloorbitron → Orbitron, tracked */
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    /* Stars 0-3 (StarsPerformancePlanet) */
    .stars-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .pos-left  .stars-row { justify-content: flex-end; }
    .pos-right .stars-row { justify-content: flex-start; }
    .star { font-size: 16px; line-height: 1; }
    .star-on  { color: var(--yellow-100); }
    .star-off { color: var(--star-inactive); }

    /* Horizontal divider line with arrow (planet_row.svg) */
    .planet-divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
    }
    .planet-divider-line {
      flex: 1;
      height: 1px;
      background: #fff;
      box-shadow: 0 0 3px #fff;
    }
    .planet-divider-arrow {
      /* planet_row.svg: a small chevron/arrow */
      width: 8px; height: 8px;
      border-top: 1.5px solid #fff;
      border-right: 1.5px solid #fff;
      flex-shrink: 0;
    }
    .pos-right .planet-divider-arrow { transform: rotate(45deg);  margin-right: -2px; order: -1; transform: rotate(-135deg); }
    .pos-left  .planet-divider-arrow { transform: rotate(45deg);  margin-left: -2px; }

    .planet-status {
      /* bodyRobotoSmallRegular.tint(contentParagraphySmall1) */
      font-size: clamp(11px, 1.2vw, 13px);
      color: rgba(255,255,255,0.75);
      max-width: 170px;
    }
    .pos-left .planet-status { text-align: right; }

    /* ─────────────── BOTTOM NAV (NavBottom Flutter) ─────────────── */
    /*
     * Container: margin(left:24,right:24,bottom:24), padding:4, height:64
     * BorderRadius:12, color: surfacesSolidDark300 = #142A51
     * 3 tabs: season(Início), rank(Ranking), profile(Perfil)
     * Selected: surfacesSolidPrimary300 = #0059E7, borderRadius:12, padding(h:12,v:8)
     */
    .bottom-nav {
      position: fixed;
      bottom: var(--nav-margin);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - var(--nav-margin) * 2);
      max-width: var(--max-content);
      height: var(--nav-height);
      background: #142A51;          /* surfacesSolidDark300 */
      border-radius: var(--nav-radius);
      padding: 4px;
      display: flex;
      align-items: stretch;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--nav-radius);
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      background: transparent;
      gap: 0;
      padding: 8px 12px;
    }
    .nav-item.active { background: var(--primary); }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.06); }

    .nav-icon {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    /* On desktop (wider than max-content / 2) show label next to icon */
    @media (min-width: 600px) {
      .nav-label {
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        margin-left: 16px;
        white-space: nowrap;
      }
    }
    @media (max-width: 599px) {
      .nav-label { display: none; }
    }

    /* ─────────────── RESPONSIVE BREAKPOINTS ─────────────── */
    /* Tablet ≤ 768px */
    @media (max-width: 768px) {
      .planet-globe-wrap {
        width: min(260px, 45vw);
        height: min(260px, 45vw);
      }
      .planet-row { padding-bottom: 48px; }
      .logo-bar   { padding: 20px 16px 32px; }
      .continue-wrap { padding: 0 16px; }
      .planets-list  { padding: 0; }
      .planet-row.pos-right { padding-right: 16px; }
      .planet-row.pos-left  { padding-left:  16px; }
    }

    /* Mobile ≤ 480px: stack planet + info vertically */
    @media (max-width: 480px) {
      .planet-row, .planet-row.pos-right, .planet-row.pos-left {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 16px 48px;
      }
      .planet-globe-wrap {
        width: min(220px, 70vw);
        height: min(220px, 70vw);
      }
      .pos-right .planet-info,
      .pos-left  .planet-info {
        align-items: center;
        text-align: center;
      }
      .pos-left  .stars-row { justify-content: center; }
      .pos-left  .planet-status { text-align: center; }
      .bottom-nav {
        border-radius: var(--nav-radius) var(--nav-radius) 0 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-layer"></div>
  <div class="bg-stars"></div>

  <!-- Meteors horizontal (MeteorsHorizontal — 5 rocks traversing right→left) -->
  <div class="meteors-layer">
    <div class="meteor-rock rock-5"></div>
    <div class="meteor-rock rock-4"></div>
    <div class="meteor-rock rock-3"></div>
    <div class="meteor-rock rock-2"></div>
    <div class="meteor-rock rock-1"></div>
  </div>

  <!-- Rocks oscillating at bottom (MeteorsRocks — 19 rocks, simplified) -->
  <div class="rocks-bottom" id="rocksBottom"></div>

  <div class="app">

    <!-- ══ LOGO BAR (Row: hidden-notif | Logo | NotifButton) ══ -->
    <div class="logo-bar">
      <div class="logo-spacer"></div>
      <!-- Logo original: orbie_shining.svg (ícone orbital laranja) + orbie_text.svg (wordmark branco) -->
      <div class="orbie-logo" title="Orbie">
        <!-- orbie_text.svg — já contém o "O" com anel orbital, sem necessidade do ícone separado -->

        { x: 49.9, y: 93, w: 16, h: 16, dur: 3.1, delay: 1.6  },
        { x: 57.9, y: 18, w: 22, h: 22, dur: 2.8, delay: 1.9  },
        { x: 47.0, y: 69, w: 18, h: 18, dur: 3.2, delay: 0.2  },
        { x: 24.0, y: 54, w: 20, h: 20, dur: 2.7, delay: 0.5  },
        { x: 36.0, y: 100, w: 14, h: 14, dur: 3.0, delay: 0.8 },
        { x: 36.2, y: 64, w: 16, h: 16, dur: 2.9, delay: 1.1  },
        { x: 40.3, y: 46, w: 18, h: 18, dur: 3.1, delay: 1.4  },
        { x: 65.7, y: 0,  w: 20, h: 20, dur: 2.8, delay: 1.7  },
      ];

      rocks.forEach(r => {
        const el = document.createElement('div');
        el.className = 'rock-dot';
        el.style.cssText = `
          left: ${r.x}%;
          bottom: ${Math.max(0, 100 - r.y)}%;
          width: ${r.w}px;
          height: ${r.h}px;
          animation-duration: ${r.dur}s;
          animation-delay: -${r.delay}s;
          border-radius: ${30 + Math.random() * 20}%;
          opacity: ${0.6 + Math.random() * 0.35};
        `;
        container.appendChild(el);
      });
    })();

    /* ── SCROLL: parallax-like background shift ── */
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      document.querySelector('.bg-stars').style.transform = `translateY(${y * 0.3}px)`;
    }, { passive: true });
  </script>
</body>
</html>
